<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LearnData ID — Belajar SQL & Python Interaktif</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Icons -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<!-- CodeMirror 5 (lebih ringan untuk single file daripada CM6 bundling) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">

<!-- Firebase compat -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
/* ====================== DESIGN TOKENS ====================== */
:root {
  --bg: #0f0f11;
  --surface: #1a1a1f;
  --surface-2: #22222a;
  --border: #2c2c36;
  --primary: #6c63ff;
  --primary-hover: #7d76ff;
  --primary-soft: rgba(108,99,255,0.15);
  --success: #4caf82;
  --warning: #f5a623;
  --error: #e05c5c;
  --text: #e8e8ed;
  --muted: #888894;
  --shadow: 0 8px 24px rgba(0,0,0,0.35);
  --radius: 12px;
  --radius-sm: 8px;
}
[data-theme="light"] {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --surface-2: #f0f0f3;
  --border: #e2e2e8;
  --text: #1a1a1f;
  --muted: #6b6b75;
  --shadow: 0 6px 18px rgba(0,0,0,0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Geist', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
code, pre, .mono { font-family: 'Geist Mono', monospace; }
button { font-family: inherit; cursor: pointer; border: none; }
input, select, textarea { font-family: inherit; }
a { color: var(--primary); text-decoration: none; }

/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

/* ====================== UTILITIES ====================== */
.hidden { display: none !important; }
.flex { display: flex; }
.center { display: flex; align-items: center; justify-content: center; }
.gap-1 { gap: 8px; } .gap-2 { gap: 16px; } .gap-3 { gap: 24px; }
.col { flex-direction: column; }
.grow { flex: 1; }

/* ====================== BUTTONS ====================== */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 18px; border-radius: var(--radius-sm);
  font-weight: 500; font-size: 14px;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border);
  transition: all 0.15s ease;
}
.btn:hover { background: var(--border); }
.btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-success { background: var(--success); color: white; border-color: var(--success); }
.btn-danger { background: var(--error); color: white; border-color: var(--error); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--surface-2); }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ====================== INPUTS ====================== */
.input {
  width: 100%; padding: 12px 14px;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 14px; transition: border 0.15s;
}
.input:focus { outline: none; border-color: var(--primary); }
.label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); font-weight: 500; }

/* ====================== CARDS ====================== */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
}

/* ====================== BADGES & PILLS ====================== */
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 999px;
  background: var(--primary-soft); color: var(--primary);
  font-size: 12px; font-weight: 500;
}
.pill-success { background: rgba(76,175,130,0.15); color: var(--success); }
.pill-warning { background: rgba(245,166,35,0.15); color: var(--warning); }
.pill-muted { background: var(--surface-2); color: var(--muted); }

/* ====================== AUTH SCREEN ====================== */
#authScreen {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  background:
    radial-gradient(circle at 20% 20%, rgba(108,99,255,0.15), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(76,175,130,0.1), transparent 40%),
    var(--bg);
}
.auth-card {
  width: 100%; max-width: 420px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 36px;
  box-shadow: var(--shadow);
}
.auth-logo {
  font-size: 26px; font-weight: 700;
  background: linear-gradient(135deg, var(--primary), #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 4px;
}
.auth-sub { color: var(--muted); margin-bottom: 28px; font-size: 14px; }
.auth-tabs { display: flex; background: var(--surface-2); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 20px; }
.auth-tab {
  flex: 1; padding: 8px; border-radius: 6px;
  text-align: center; font-size: 14px; font-weight: 500;
  background: transparent; color: var(--muted);
}
.auth-tab.active { background: var(--surface); color: var(--text); }
.auth-divider {
  display: flex; align-items: center; gap: 12px;
  margin: 18px 0; color: var(--muted); font-size: 12px;
}
.auth-divider::before, .auth-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

/* ====================== APP SHELL ====================== */
#appScreen { display: none; min-height: 100vh; }
.layout { display: flex; min-height: 100vh; }
.sidebar {
  width: 260px; background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 20px; display: flex; flex-direction: column; gap: 8px;
  position: sticky; top: 0; height: 100vh;
}
.sidebar-logo {
  font-weight: 700; font-size: 18px; margin-bottom: 20px;
  background: linear-gradient(135deg, var(--primary), #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; border-radius: var(--radius-sm);
  color: var(--muted); font-size: 14px; font-weight: 500;
  cursor: pointer; transition: all 0.15s;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--primary-soft); color: var(--primary); }
.nav-section { font-size: 11px; text-transform: uppercase; color: var(--muted); padding: 12px 14px 6px; letter-spacing: 0.5px; }

.main { flex: 1; padding: 28px 36px; max-width: 1200px; }
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
.page-title { font-size: 24px; font-weight: 600; }
.page-sub { color: var(--muted); font-size: 14px; margin-top: 4px; }

.avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--primary); color: white;
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 14px;
}
.user-menu { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 6px 10px; border-radius: var(--radius-sm); }
.user-menu:hover { background: var(--surface-2); }

/* ====================== DASHBOARD ====================== */
.grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.stat-card { padding: 18px; }
.stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
.stat-value { font-size: 28px; font-weight: 600; margin-top: 6px; }
.stat-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }

.progress-ring-wrap { display: flex; align-items: center; gap: 24px; }
.activity-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.activity-item:last-child { border-bottom: none; }
.activity-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.activity-text { flex: 1; font-size: 14px; }
.activity-time { font-size: 12px; color: var(--muted); }

/* ====================== COURSE LIST ====================== */
.track-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.chapter-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.chapter-card {
  padding: 18px; cursor: pointer;
  transition: all 0.2s; position: relative;
}
.chapter-card:hover:not(.locked) { border-color: var(--primary); transform: translateY(-2px); }
.chapter-card.locked { opacity: 0.5; cursor: not-allowed; }
.chapter-num { font-size: 12px; color: var(--muted); }
.chapter-title { font-weight: 600; margin: 6px 0 8px; }
.chapter-desc { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.chapter-meta { display: flex; gap: 8px; align-items: center; }

/* ====================== CHAPTER VIEW ====================== */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 24px; position: relative; }
.tab {
  padding: 12px 18px; cursor: pointer;
  color: var(--muted); font-size: 14px; font-weight: 500;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.tab.disabled { opacity: 0.4; cursor: not-allowed; }

.materi-content { max-width: 760px; line-height: 1.8; }
.materi-content h2 { font-size: 22px; margin: 24px 0 12px; }
.materi-content h3 { font-size: 17px; margin: 20px 0 8px; color: var(--primary); }
.materi-content p { margin-bottom: 12px; }
.materi-content ul, .materi-content ol { margin-left: 24px; margin-bottom: 12px; }
.materi-content li { margin-bottom: 4px; }
.materi-content code:not(pre code) {
  background: var(--surface-2); padding: 2px 6px; border-radius: 4px;
  font-size: 13px; color: var(--primary);
}
.materi-content pre {
  background: var(--surface-2); padding: 16px; border-radius: var(--radius-sm);
  overflow-x: auto; margin: 12px 0; font-size: 13px;
  border: 1px solid var(--border);
}
.callout {
  background: var(--primary-soft); border-left: 3px solid var(--primary);
  padding: 14px 18px; border-radius: var(--radius-sm); margin: 16px 0;
}
.callout-title { font-weight: 600; margin-bottom: 6px; color: var(--primary); }
.analogi {
  background: rgba(245,166,35,0.1); border-left: 3px solid var(--warning);
  padding: 14px 18px; border-radius: var(--radius-sm); margin: 16px 0;
}
.poin-penting {
  background: rgba(76,175,130,0.1); border: 1px solid var(--success);
  padding: 18px; border-radius: var(--radius); margin-top: 24px;
}

/* ====================== SANDBOX ====================== */
.sandbox { display: grid; grid-template-rows: auto 1fr auto; gap: 12px; height: calc(100vh - 240px); min-height: 500px; }
.editor-toolbar { display: flex; gap: 8px; align-items: center; }
.editor-wrap { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.CodeMirror { height: 100% !important; font-family: 'Geist Mono', monospace; font-size: 14px; }
.output-panel {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 14px;
  overflow: auto; max-height: 300px;
  font-family: 'Geist Mono', monospace; font-size: 13px;
  white-space: pre-wrap;
}
.output-panel.error { border-color: var(--error); color: var(--error); }
.output-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.output-table th, .output-table td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); }
.output-table th { background: var(--surface); font-weight: 600; }

/* ====================== KUIS ====================== */
.quiz-question { margin-bottom: 24px; }
.quiz-q-text { font-weight: 500; margin-bottom: 12px; }
.quiz-option {
  display: block; padding: 12px 16px; margin-bottom: 8px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); cursor: pointer; transition: all 0.15s;
}
.quiz-option:hover { border-color: var(--primary); }
.quiz-option.selected { background: var(--primary-soft); border-color: var(--primary); }
.quiz-option.correct { background: rgba(76,175,130,0.15); border-color: var(--success); }
.quiz-option.wrong { background: rgba(224,92,92,0.15); border-color: var(--error); }
.quiz-feedback { margin-top: 8px; padding: 10px; border-radius: var(--radius-sm); font-size: 13px; }
.quiz-feedback.correct { background: rgba(76,175,130,0.1); color: var(--success); }
.quiz-feedback.wrong { background: rgba(224,92,92,0.1); color: var(--error); }

/* ====================== TANTANGAN ====================== */
.challenge-desc { background: var(--surface); padding: 18px; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 16px; }
.expected-box { background: var(--surface-2); padding: 12px; border-radius: var(--radius-sm); margin-top: 12px; }
.hints-row { display: flex; gap: 8px; margin-top: 12px; }
.hint-btn {
  padding: 8px 14px; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 13px; color: var(--text);
}
.hint-revealed { background: rgba(245,166,35,0.1); border-color: var(--warning); padding: 12px; border-radius: var(--radius-sm); margin-top: 8px; font-size: 13px; }

/* ====================== TOAST ====================== */
.toast-container { position: fixed; top: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--surface); border: 1px solid var(--border);
  padding: 14px 18px; border-radius: var(--radius);
  box-shadow: var(--shadow); min-width: 280px;
  display: flex; gap: 12px; align-items: center;
  animation: slideIn 0.3s ease;
}
.toast.success { border-left: 3px solid var(--success); }
.toast.error { border-left: 3px solid var(--error); }
.toast.xp { border-left: 3px solid var(--primary); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ====================== MODAL ====================== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; backdrop-filter: blur(4px);
}
.modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 28px;
  max-width: 460px; width: 90%;
}
.modal-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
.modal-text { color: var(--muted); margin-bottom: 20px; font-size: 14px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

/* ====================== BADGES GRID ====================== */
.badges-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.badge-item {
  text-align: center; padding: 16px;
  background: var(--surface-2); border-radius: var(--radius);
  border: 1px solid var(--border);
}
.badge-item.earned { border-color: var(--primary); background: var(--primary-soft); }
.badge-emoji { font-size: 32px; margin-bottom: 6px; opacity: 0.4; }
.badge-item.earned .badge-emoji { opacity: 1; }
.badge-name { font-size: 13px; font-weight: 500; }

/* ====================== LOADING ====================== */
.spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--border); border-top-color: var(--primary);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.full-loader { position: fixed; inset: 0; background: rgba(15,15,17,0.9); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; z-index: 9999; }

/* ====================== LEVEL BAR ====================== */
.level-bar-wrap { background: var(--surface-2); height: 8px; border-radius: 4px; overflow: hidden; margin-top: 6px; }
.level-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #a78bfa); transition: width 0.5s; }

@media (max-width: 768px) {
  .sidebar { display: none; }
  .main { padding: 16px; }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
}
</style>
</head>

<div id="authScreen">

/* ================================================================
   ENGINE: sql.js (lazy)
   ================================================================ */
let SQLEngine = null, sqlDB = null, sqlLoading = null;
async function loadSQL() {
  if (SQLEngine) return SQLEngine;
  if (sqlLoading) return sqlLoading;
  sqlLoading = (async () => {
    const initSqlJs = (await import('https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js')).default ||
                      window.initSqlJs;
    const SQL = await initSqlJs({ locateFile: f => `https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/${f}` });
    SQLEngine = SQL;
    sqlDB = new SQL.Database();
    sqlDB.run(SAMPLE_SQL_INIT);
    return SQL;
  })();
  return sqlLoading;
}
// Fallback: pakai script tag
function loadSQLViaScript() {
  return new Promise((resolve, reject) => {
    if (window.initSqlJs) return resolve();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js';
    s.onload = () => resolve();
    s.onerror = reject;
    document.head.appendChild(s);
  });
}
async function runSQL(query) {
  await loadSQLViaScript();
  if (!SQLEngine) {
    SQLEngine = await window.initSqlJs({ locateFile: f => `https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/${f}` });
    sqlDB = new SQLEngine.Database();
    sqlDB.run(SAMPLE_SQL_INIT);
  }
  try {
    const res = sqlDB.exec(query);
    if (!res.length) return { ok:true, rows:[], cols:[], message:"Query berhasil dijalankan. Tidak ada baris yang dikembalikan." };
    return { ok:true, cols: res[0].columns, rows: res[0].values };
  } catch(e) {
    return { ok:false, error: translateSQLError(e.message) };
  }
}
function translateSQLError(msg) {
  const m = msg.toLowerCase();
  if (m.includes('no such table')) return "❌ Tabel tidak ditemukan. Periksa nama tabel kamu (contoh: produk, pelanggan, transaksi).";
  if (m.includes('no such column')) return "❌ Nama kolom tidak dikenali. Periksa ejaan kolom yang kamu pakai.";
  if (m.includes('syntax error')) return "❌ Ada kesalahan penulisan (syntax error). Cek tanda kurung, koma, atau kata kunci SQL.";
  if (m.includes('ambiguous')) return "❌ Nama kolom ambigu. Jika ada kolom sama di 2 tabel, sebutkan nama tabelnya (contoh: produk.id).";
  return "❌ Error: " + msg;
}

/* ================================================================
   ENGINE: Pyodide (lazy)
   ================================================================ */
let pyodide = null, pyLoading = null;
async function loadPyodideLazy() {
  if (pyodide) return pyodide;
  if (pyLoading) return pyLoading;
  pyLoading = (async () => {
    if (!window.loadPyodide) {
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js';
        s.onload = res; s.onerror = rej;
        document.head.appendChild(s);
      });
    }
    pyodide = await window.loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/' });
    await pyodide.loadPackage(['pandas']);
    await pyodide.runPythonAsync(PYTHON_DATA_SETUP);
    return pyodide;
  })();
  return pyLoading;
}
async function runPython(code) {
  try {
    await loadPyodideLazy();
    // capture stdout
    pyodide.runPython(`
import sys, io
_stdout = io.StringIO()
sys.stdout = _stdout
`);
    let result;
    try {
      result = await pyodide.runPythonAsync(code);
    } catch(e) {
      pyodide.runPython('sys.stdout = sys.__stdout__');
      return { ok:false, error: translatePyError(e.message) };
    }
    const out = pyodide.runPython('sys.stdout.getvalue()');
    pyodide.runPython('sys.stdout = sys.__stdout__');
    let text = out || '';
    if (result !== undefined && result !== null) {
      try { text += (text ? '\n' : '') + result.toString(); } catch(_){}
    }
    return { ok:true, output: text || '✓ Kode berhasil dijalankan (tidak ada output).' };
  } catch(e) {
    return { ok:false, error: translatePyError(e.message) };
  }
}
function translatePyError(msg) {
  if (msg.includes('NameError')) return "❌ Variabel atau nama tidak dikenali. Pastikan kamu sudah membuatnya sebelum dipakai.\n\n" + msg;
  if (msg.includes('SyntaxError')) return "❌ Ada kesalahan penulisan. Cek tanda kurung, titik dua (:), atau indentasi.\n\n" + msg;
  if (msg.includes('IndentationError')) return "❌ Indentasi (jarak spasi di awal baris) tidak konsisten. Python sensitif terhadap indentasi.\n\n" + msg;
  if (msg.includes('TypeError')) return "❌ Tipe data tidak cocok untuk operasi ini.\n\n" + msg;
  if (msg.includes('KeyError')) return "❌ Key tidak ditemukan di dictionary/DataFrame.\n\n" + msg;
  if (msg.includes('IndexError')) return "❌ Index di luar jangkauan list.\n\n" + msg;
  return "❌ " + msg;
}

async function saveUserData() {
  if (!useFirebase || !STATE.user) return;
  try {
    const ref = db.collection('users').doc(STATE.user.uid);
    await ref.set({
      profile: STATE.profile,
      stats: STATE.stats,
      badges: STATE.badges,
      progress: STATE.progress,
      activity: STATE.activity.slice(0, 50),
      weeklyXP: STATE.weeklyXP,
    }, { merge: true });
  } catch(e) { console.error("Save error", e); }
}
async function loadUserData(uid) {
  if (!useFirebase) return;
  try {
    const doc = await db.collection('users').doc(uid).get();
    if (doc.exists) {
      const d = doc.data();
      Object.assign(STATE.profile, d.profile || {});
      Object.assign(STATE.stats, d.stats || {});
      STATE.badges = d.badges || [];
      STATE.progress = d.progress || {};
      STATE.activity = d.activity || [];
      STATE.weeklyXP = d.weeklyXP || [0,0,0,0,0,0,0];
    }
  } catch(e) { console.error("Load error", e); }
}
async function saveSubmission(track, chapter, type, code, output, passed) {
  if (!useFirebase || !STATE.user) return;
  try {
    await db.collection('users').doc(STATE.user.uid).collection('submissions').add({
      track, chapter, type, code, output: String(output).slice(0, 2000), passed,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch(e) { console.error(e); }
}

/* ================================================================
   XP / BADGES / ACTIVITY
   ================================================================ */
function addXP(amount, reason) {
  STATE.stats.totalXP += amount;
  STATE.stats.level = getLevel(STATE.stats.totalXP).num;
  // weekly bucket
  const day = (new Date().getDay() + 6) % 7; // Sen=0
  STATE.weeklyXP[day] = (STATE.weeklyXP[day] || 0) + amount;
  toast(`+${amount} XP — ${reason}`, 'xp');
  logActivity(`🎯 ${reason}`);
  refreshHeader();
  saveUserData();
}
function logActivity(text) {
  STATE.activity.unshift({ text, time: Date.now() });
  STATE.activity = STATE.activity.slice(0, 20);
}
function checkBadges() {
  const earn = (id) => {
    if (STATE.badges.find(b => b.id === id)) return;
    const b = ALL_BADGES.find(x => x.id === id);
    if (!b) return;
    STATE.badges.push({ id, name: b.name, earnedAt: Date.now() });
    toast(`🏆 Badge baru: ${b.name}!`, 'success');
    logActivity(`🏆 Mendapat badge "${b.name}"`);
  };
  if (chapterComplete('sql', 1)) earn('first_query');
  if (chapterComplete('python', 1)) earn('snake_starter');
  if (STATE.stats.streak >= 3) earn('streak_3');
  if ([1,2,3,4,5,6].every(n => chapterComplete('sql', n))) earn('sql_master');
  if ([1,2,3,4,5,6].every(n => chapterComplete('python', n))) earn('pythonista');
  if ([1,2,3,4,5,6].every(n => chapterComplete('sql', n)) &&
      [1,2,3,4,5,6].every(n => chapterComplete('python', n))) earn('data_ruler');
}
function chapterComplete(track, n) {
  const p = STATE.progress[`${track}_${n}`];
  return p && p.challengeCompleted;
}
function chapterUnlocked(track, n) {
  if (n === 1) return true;
  return chapterComplete(track, n - 1);
}
function progressOf(track) {
  const total = 6;
  let done = 0;
  for (let i=1; i<=total; i++) if (chapterComplete(track, i)) done++;
  return Math.round((done/total)*100);
}

function toast(msg, type='success') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<div>${msg}</div>`;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transform='translateX(100%)'; t.style.transition='all .3s'; }, 3500);
  setTimeout(() => t.remove(), 4000);
}
function showModal({ title, text, confirmText='OK', confirmStyle='btn-primary', cancelText='Batal', onConfirm }) {
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay">

        <div class="modal-text">${text}</div>

          <button class="btn" id="mCancel">${cancelText}</button>
          <button class="btn ${confirmStyle}" id="mOk">${confirmText}</button>

}

function findLastIncomplete() {
  for (const track of ['sql','python']) {
    for (let i=1; i<=6; i++) {
      if (chapterUnlocked(track, i) && !chapterComplete(track, i)) {
        return { track, id: i };
      }
    }
  }
  return null;
}
function timeAgo(ts) {
  const d = Date.now() - ts;
  if (d < 60000) return 'baru saja';
  if (d < 3600000) return Math.floor(d/60000) + ' menit lalu';
  if (d < 86400000) return Math.floor(d/3600000) + ' jam lalu';
  return Math.floor(d/86400000) + ' hari lalu';
}

function persistEditors() {
  // Simpan isi editor yang masih hidup ke STATE.drafts sebelum DOM diganti
  if (!currentChapter) return;
  const base = `${currentChapter.track}_${currentChapter.id}`;
  try {
    if (sandboxEditor && document.body.contains(sandboxEditor.getWrapperElement())) {
      STATE.drafts[`${base}_sandbox`] = sandboxEditor.getValue();
    }
  } catch(_) {}
  try {
    if (challengeEditor && document.body.contains(challengeEditor.getWrapperElement())) {
      STATE.drafts[`${base}_challenge`] = challengeEditor.getValue();
    }
  } catch(_) {}
}

    const draftKey = `${track}_${id}_sandbox`;
    document.getElementById('codeEditor').value = STATE.drafts[draftKey] ?? starter;
    sandboxEditor = CodeMirror.fromTextArea(document.getElementById('codeEditor'), {
      lineNumbers: true,
      mode: track === 'sql' ? 'text/x-sql' : 'python',

async function runSandbox() {
  const code = sandboxEditor.getValue();
  const out = document.getElementById('outputPanel');
  const status = document.getElementById('engineStatus');
  out.classList.remove('error');
  out.innerHTML = '<div class="spinner"></div> Menjalankan...';
  status.textContent = currentChapter.track === 'sql' ? 'Memuat sql.js...' : 'Memuat Pyodide (pertama kali bisa 20-30 detik)...';

  if (currentChapter.track === 'sql') {
    const r = await runSQL(code);
    status.textContent = 'sql.js siap';
    if (!r.ok) { out.classList.add('error'); out.textContent = r.error; return; }
    if (r.rows.length === 0) { out.textContent = r.message || '(0 baris)'; return; }
    out.innerHTML = renderSQLTable(r.cols, r.rows) + `<div style="margin-top:8px; color:var(--muted); font-size:12px;">${r.rows.length} baris</div>`;
  } else {
    const r = await runPython(code);
    status.textContent = 'Pyodide siap';
    if (!r.ok) { out.classList.add('error'); out.textContent = r.error; return; }
    out.textContent = r.output;
  }
}
function renderSQLTable(cols, rows) {
  return `<table class="output-table"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>

let quizState = null;
function renderQuiz(wrap, quiz) {
  quizState = { quiz, answers: Array(quiz.length).fill(null), submitted: false };
  wrap.innerHTML = `
    <div id="quizList"></div>
    <button class="btn btn-primary" id="submitQuiz" style="margin-top:16px;"><i data-lucide="check-circle"></i> Kirim Jawaban</button>
    <div id="quizResult" style="margin-top:16px;"></div>
  `;
  renderQuizList();
  document.getElementById('submitQuiz').onclick = submitQuiz;
}
function renderQuizList() {
  const list = document.getElementById('quizList');
  list.innerHTML = quizState.quiz.map((q, qi) => `
    <div class="card quiz-question">
      <div class="quiz-q-text">${qi+1}. ${q.q}</div>
      ${q.opts.map((opt, oi) => `
        <div class="quiz-option ${quizState.answers[qi]===oi?'selected':''} ${quizState.submitted ? (oi===q.ans?'correct':(quizState.answers[qi]===oi?'wrong':'')) : ''}"
             onclick="${quizState.submitted?'':`pickAnswer(${qi},${oi})`}">${opt}</div>
      `).join('')}
      ${quizState.submitted ? `<div class="quiz-feedback ${quizState.answers[qi]===q.ans?'correct':'wrong'}">
        ${quizState.answers[qi]===q.ans?'✓ Benar!':'✗ Kurang tepat.'} ${q.exp || ''}
      </div>` : ''}
    </div>
  `).join('');
}
function pickAnswer(qi, oi) { quizState.answers[qi] = oi; renderQuizList(); }
function submitQuiz() {
  if (quizState.answers.some(a => a === null)) { toast('Jawab semua soal dulu ya!', 'error'); return; }
  quizState.submitted = true;
  const correct = quizState.quiz.filter((q,i) => quizState.answers[i] === q.ans).length;
  const score = Math.round((correct / quizState.quiz.length) * 100);
  const key = `${currentChapter.track}_${currentChapter.id}`;
  const prev = STATE.progress[key].quizScore || 0;
  STATE.progress[key].quizAttempts = (STATE.progress[key].quizAttempts || 0) + 1;
  STATE.progress[key].quizScore = Math.max(prev, score);
  renderQuizList();
  const res = document.getElementById('quizResult');
  res.innerHTML = `<div class="card" style="text-align:center;">
    <div style="font-size:28px; font-weight:600;">Skor: ${score}/100</div>
    <div style="color:var(--muted); margin-top:6px;">${correct} dari ${quizState.quiz.length} jawaban benar</div>
    ${score >= 60 ? `<div style="color:var(--success); margin-top:10px;">✓ Tab Tantangan terbuka!</div>` : `<div style="color:var(--error); margin-top:10px;">Skor minimal 60 untuk membuka Tantangan. Coba lagi!</div>`}
    <button class="btn" style="margin-top:14px;" onclick="renderQuiz(document.getElementById('chapterTabContent'), CHAPTER_CONTENT['${key}']?.quiz || defaultQuiz())">Ulangi Kuis</button>
  </div>`;
  if (score > prev) addXP(20 + (score === 100 ? 10 : 0), `Kuis ${currentChapter.ch.title}`);
  // re-render tabs (challenge state)
  document.querySelectorAll('[data-ctab="challenge"]').forEach(t => t.classList.toggle('disabled', score < 60 && prev < 60));
  saveUserData();
}

let challengeState = null;
let challengeEditor = null;
function renderChallenge(wrap, ch) {
  challengeState = { ch, hintsRevealed: 0 };

      <div class="hints-row">

        <button class="hint-btn" onclick="revealHint(1)">💡 Hint 2 (-10 XP)</button>
        <button class="hint-btn" onclick="revealHint(2)">💡 Hint 3 (-10 XP)</button>

    </div>
  `;
  const chDraftKey = `${currentChapter.track}_${currentChapter.id}_challenge`;
  document.getElementById('challengeEditor').value = STATE.drafts[chDraftKey] ?? (ch.starter || '');
  challengeEditor = CodeMirror.fromTextArea(document.getElementById('challengeEditor'), {
    lineNumbers: true,
    mode: currentChapter.track === 'sql' ? 'text/x-sql' : 'python',

  });
  document.getElementById('checkBtn').onclick = checkChallenge;
}
function revealHint(i) {
  const area = document.getElementById('hintsArea');
  const hints = challengeState.ch.hints || [];
  if (!hints[i]) return;
  if (area.querySelector(`[data-hint="${i}"]`)) return;
  area.insertAdjacentHTML('beforeend', `<div class="hint-revealed" data-hint="${i}">Hint ${i+1}: ${hints[i]}</div>`);
  challengeState.hintsRevealed++;
  const key = `${currentChapter.track}_${currentChapter.id}`;
  STATE.progress[key].hintsUsed = challengeState.hintsRevealed;
  toast(`Hint terbuka — biaya 10 XP saat menyelesaikan.`, 'xp');
}

async function checkChallenge() {
  const code = challengeEditor.getValue();
  const out = document.getElementById('challengeOutput');
  out.classList.remove('error');
  out.innerHTML = '<div class="spinner"></div> Memeriksa...';
  const key = `${currentChapter.track}_${currentChapter.id}`;
  STATE.progress[key].challengeAttempts = (STATE.progress[key].challengeAttempts || 0) + 1;

  let result, actualText;
  if (currentChapter.track === 'sql') {
    result = await runSQL(code);
    if (!result.ok) { out.classList.add('error'); out.textContent = result.error; return; }
    actualText = serializeSQLResult(result);
    out.innerHTML = renderSQLTable(result.cols, result.rows);
  } else {
    result = await runPython(code);
    if (!result.ok) { out.classList.add('error'); out.textContent = result.error; return; }
    actualText = result.output.trim();
    out.textContent = result.output;
  }

  const passed = challengeState.ch.validate
    ? challengeState.ch.validate(result, code)
    : normalizeOutput(actualText) === normalizeOutput(challengeState.ch.expected);

  await saveSubmission(currentChapter.track, currentChapter.id, 'challenge', code, actualText, passed);

  if (passed) {
    if (STATE.progress[key].challengeCompleted) {
      toast('✓ Sudah pernah selesai. Tapi tetap mantap!', 'success');
      return;
    }
    STATE.progress[key].challengeCompleted = true;
    const xp = Math.max(10, 50 - (challengeState.hintsRevealed * 10));
    addXP(xp, `Tantangan ${currentChapter.ch.title}`);
    STATE.progress[key].xpEarned = xp;
    checkBadges();
    out.insertAdjacentHTML('afterend', `<div class="callout" style="margin-top:12px;"><div class="callout-title">🎉 Berhasil!</div>Chapter ini selesai. Chapter berikutnya sudah terbuka.</div>`);
  } else {
    out.insertAdjacentHTML('afterend', `<div class="quiz-feedback wrong" style="margin-top:8px;">Output belum sesuai. Bandingkan dengan expected output dan coba lagi.</div>`);
  }
  saveUserData();
}
function serializeSQLResult(r) {
  if (!r.rows.length) return '';
  return r.cols.join('|') + '\n' + r.rows.map(row => row.join('|')).join('\n');
}
function normalizeOutput(s) {
  return String(s).replace(/\s+/g,' ').trim().toLowerCase();
}
function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
